
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEM CASH INTERNATIONAL</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #07130e;
  color: white;
}
header {
  background: #10271b;
  padding: 25px 18px;
  border-bottom: 2px solid #d5a52e;
}
h1 { color: #d5a52e; font-size: 25px; }
.tagline { color: #ddd; }
main { padding: 20px; }
.balance {
  background: #174b30;
  padding: 24px;
  border-radius: 15px;
  margin-bottom: 25px;
}
.balance h2 { color: #e7c35b; }
.amount { font-size: 30px; font-weight: bold; }
.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.action {
  background: #183b29;
  padding: 22px 8px;
  border-radius: 12px;
  text-align: center;
  border: 1px solid #d5a52e;
}
.action span { font-size: 25px; }
h3 { color: #e5bd50; }
footer {
  text-align: center;
  padding: 25px;
  color: #aaa;
}
</style>
</head>
<body>
<header>
  <h1>DEM CASH INTERNATIONAL</h1>
  <p class="tagline">Your Money. Your World. Your Future.</p>
</header>
<main>
  <div class="balance">
    <h2>My Wallet</h2>
    <p>Available Balance</p>
    <div class="amount">SLE 0.00</div>
  </div>

  <h3>Our Services</h3>
  <div class="actions">
    <div class="action"><span>📱</span><p>Mobile Money</p></div>
    <div class="action"><span>🏦</span><p>Bank Transfer</p></div>
    <div class="action"><span>💵</span><p>Cash Deposit</p></div>
    <div class="action"><span>💳</span><p>Debit Card</p></div>
    <div class="action"><span>🌍</span><p>International Transfers</p></div>
    <div class="action"><span>₿</span><p>Cryptocurrency</p></div>
  </div>
</main>
<footer>
  DEM CASH INTERNATIONAL © 2026
</footer>
</body>
</html>
